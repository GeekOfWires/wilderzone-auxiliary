<svg xmlns="http://w3.org" viewBox="0 0 1000 140" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Squada+One&display=swap');
      .t2-brand-title {
        font-family: 'Squada One', 'Arial Black', sans-serif;
      }
      .t2-brand-hud {
        font-family: 'Orbitron', sans-serif;
      }
    </style>

    <!-- Metallic Font Fill Gradient -->
    <linearGradient id="text-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="48%" stop-color="#E5E7EB" />
      <stop offset="52%" stop-color="#9CA3AF" />
      <stop offset="100%" stop-color="#5A616B" />
    </linearGradient>
    
    <!-- TribesNEXT Style Neon Amber Fill Gradient -->
    <linearGradient id="text-amber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    
    <!-- TribesNEXT Style Neon Teal Fill Gradient -->
    <linearGradient id="text-teal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="35%" stop-color="#72dca5" />
      <stop offset="100%" stop-color="#20352d" />
    </linearGradient>
  </defs>

  <!-- Centered Title Block -->
  <g transform="translate(500, 76) scale(0.48, 0.82)">
    <text x="0" y="0" 
          class="t2-brand-title"
          font-size="124" 
          font-style="italic"
          letter-spacing="2"
          text-anchor="middle" 
          stroke="#000000" 
          stroke-width="6"
          stroke-linejoin="miter"
          style="paint-order: stroke fill; filter: drop-shadow(0px 5px 4px rgba(0,0,0,1));">
      <tspan fill="url(#text-metal)">WILDER</tspan><tspan fill="url(#text-amber)">ZONE</tspan> <tspan fill="url(#text-teal)">AUXILIARY</tspan>
    </text>
  </g>

  <!-- Compliance Description Footer Text -->
  <text x="500" y="115" 
        class="t2-brand-hud"
        font-size="11" 
        font-weight="700" 
        letter-spacing="2.5" 
        text-anchor="middle" 
        fill="#E5E7EB"
        stroke="#000000"
        stroke-width="2"
        style="paint-order: stroke fill; filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.8));">
    <tspan fill="url(#text-metal)">BACKGROUND INTERFACING FOR</tspan> <tspan fill="url(#text-amber)">TRIBES</tspan> <tspan fill="url(#text-teal)">2</tspan> <tspan fill="url(#text-metal)">MULTIPLAYER SERVERS</tspan>
  </text>
</svg>
